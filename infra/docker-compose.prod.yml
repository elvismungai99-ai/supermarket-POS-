x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

services:
  db:
    image: postgres:17
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "max_connections=150"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "work_mem=8MB"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pos}
      POSTGRES_USER: ${POSTGRES_USER:-pos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    networks:
      - backend_internal
    mem_limit: 1g
    cpus: 1.5
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pos} -d ${POSTGRES_DB:-pos}"]
      interval: 10s
      timeout: 5s
      retries: 5

  pos-backend:
    build:
      context: ../backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-pos}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-pos}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      HIKARI_MAX_POOL_SIZE: ${HIKARI_MAX_POOL_SIZE:-25}
      POS_SECURITY_REQUIRE_AUTH: "true"
      POS_SECURITY_ENFORCE_STRONG_KEYS: "true"
      POS_SECURITY_TRUST_FORWARDED_HEADERS: "true"
      FORWARD_HEADERS_STRATEGY: "FRAMEWORK"
      POS_JWT_TTL_SECONDS: ${POS_JWT_TTL_SECONDS:-3600}
      POS_JWT_SECRET: ${POS_JWT_SECRET:?Set strong 32+ char POS_JWT_SECRET in .env}
      POS_ENCRYPTION_KEY: ${POS_ENCRYPTION_KEY:?Set distinct 32+ char POS_ENCRYPTION_KEY in .env}
      POS_MPESA_ENABLED: ${POS_MPESA_ENABLED:-false}
      POS_MPESA_ALLOWED_CALLBACK_IPS: ${POS_MPESA_ALLOWED_CALLBACK_IPS:-}
      POS_MPESA_CALLBACK_SECRET: ${POS_MPESA_CALLBACK_SECRET:-}
    networks:
      - backend_internal
      - edge_net
    mem_limit: 1g
    cpus: 1.5
    logging: *default-logging

  till-ui:
    build:
      context: ../till-ui
    restart: unless-stopped
    networks:
      - edge_net
    mem_limit: 256m
    cpus: 0.5
    logging: *default-logging

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - pos-backend
      - till-ui
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - edge_net
    mem_limit: 256m
    cpus: 0.5
    logging: *default-logging

volumes:
  pgdata_prod:

networks:
  backend_internal:
    internal: true
  edge_net:
