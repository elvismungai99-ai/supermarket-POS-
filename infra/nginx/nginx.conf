worker_processes auto;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  tcp_nopush on;
  server_tokens off;
  client_max_body_size 2m;

  # Compression for JSON APIs and Vite JS/CSS bundles
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

  # Rate limit zones
  limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=api_limit:20m rate=60r/s;

  # Keepalive upstream pool (add more pos-backend replicas here when scaling horizontally)
  upstream pos_backend_pool {
    server pos-backend:8080;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' http://127.0.0.1:9001 http://localhost:9001; frame-ancestors 'none'" always;

    # Strict rate limiting on authentication & registration endpoints
    location ~ ^/api/auth/(login|register|verify-supervisor-override)$ {
      limit_req zone=auth_limit burst=10 nodelay;
      proxy_pass http://pos_backend_pool;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional: restrict live Daraja callbacks strictly to Safaricom CIDR ranges when POS_MPESA_ENABLED=true
    location /api/payments/mpesa-callback {
      # allow 196.201.214.0/24;
      # allow 196.201.213.0/24;
      # allow 196.201.212.0/24;
      # deny all;
      proxy_pass http://pos_backend_pool;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
      limit_req zone=api_limit burst=120 nodelay;
      proxy_pass http://pos_backend_pool;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/health {
      proxy_pass http://pos_backend_pool;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
    }

    location /assets/ {
      proxy_pass http://till-ui:80;
      proxy_set_header Host $host;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
      proxy_pass http://till-ui:80;
      proxy_set_header Host $host;
    }
  }
}
